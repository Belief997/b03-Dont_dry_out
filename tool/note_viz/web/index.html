<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · review</title>
<style>/*__CSS__*/</style>
</head>
<body>

<header id="top">
  <div class="brand">
    <span class="pulse"></span>
    <span class="doc-title" id="doc-title">__TITLE__</span>
    <span class="meta" id="doc-meta"></span>
  </div>
  <nav id="tabs" role="tablist"></nav>
  <div class="tools">
    <div class="searchbox">
      <input id="search" type="search" placeholder="搜索 命令 / 章节 / 状态码 / 全文" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <button class="icon-btn" id="theme-btn" title="切换明暗主题">◐</button>
    <span class="live" id="live" title="实时重建"><i></i><em>static</em></span>
  </div>
</header>

<div id="search-panel" hidden></div>

<main id="app">
  <aside id="side">
    <div class="side-head">
      <input id="side-filter" type="search" placeholder="过滤章节…" autocomplete="off">
      <button class="icon-btn" id="side-toggle" title="收起侧栏">⟨</button>
    </div>
    <div id="side-body"></div>
  </aside>
  <section id="view"></section>
</main>

<footer id="status">
  <span id="status-left"></span>
  <span id="status-right"></span>
</footer>

<div id="note-editor" hidden>
  <div class="ne-head"><b>审阅批注</b><span id="ne-anchor"></span></div>
  <textarea id="ne-text" rows="4" placeholder="这条要改什么？为什么？"></textarea>
  <div class="ne-foot">
    <button id="ne-save" class="primary">保存</button>
    <button id="ne-cancel">取消</button>
    <button id="ne-del" class="danger" hidden>删除</button>
  </div>
</div>

<script>/*__DATA__*/</script>
<script>/*__JS__*/</script>
</body>
</html>
